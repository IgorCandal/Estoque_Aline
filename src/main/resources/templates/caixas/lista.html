<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #212529;
        }
        .container {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .title {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }
        /* Botões */
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border-radius: 0.375rem;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn-primary { background-color: #0d6efd; color: white; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5c636a; }
        .btn-success { background-color: #198754; color: white; }
        .btn-success:hover { background-color: #157347; }
        .btn-outline-danger { border-color: #dc3545; color: #dc3545; background: transparent; }
        .btn-outline-danger:hover { background-color: #dc3545; color: white; }
        .btn-outline-warning { border-color: #ffc107; color: #b58100; background: transparent; margin-right: 0.25rem; }
        .btn-outline-warning:hover { background-color: #ffc107; color: black; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.875rem; }

        /* Tabela e Cartão */
        .card {
            background-color: white;
            border-radius: 0.375rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            overflow: hidden;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .table th, .table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #dee2e6;
            vertical-align: middle;
        }
        .table thead { background-color: #212529; color: white; }
        .table-hover tbody tr:hover { background-color: rgba(0, 0, 0, 0.075); }
        .text-end { text-align: right; }
        .text-center { text-align: center; }

        /* Emblema (Badge) */
        .badge {
            display: inline-block;
            padding: 0.35rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            background-color: #212529;
            border-radius: 0.375rem;
        }

        /* Estrutura Nativa do Modal usando Popover API */
        div[popover] {
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            padding: 0;
            width: 100%;
            max-width: 500px;
            background: white;
        }
        div[popover]::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: #212529;
            color: white;
        }
        .modal-title { margin: 0; font-size: 1.25rem; }
        .btn-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
        }
        .modal-body { padding: 1rem; }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid #dee2e6;
        }

        /* Formulários */
        .form-label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        .form-control {
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            box-sizing: border-box;
        }

        /* ========================================================
           ESTILO LISTA DE APLICATIVO PARA CELULAR
           ======================================================== */
        @media (max-width: 768px) {
            .container {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }
            .header-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
                margin-bottom: 1rem;
            }
            .header-actions .btn {
                justify-content: center;
                width: 100%;
            }

            /* Remove estilos do card container na versão mobile */
            .card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                overflow: visible !important;
            }

            /* Oculta o cabeçalho preto original */
            .table thead {
                display: none !important;
            }

            /* Transforma a tabela em uma lista flexível */
            .table, .table tbody {
                display: block !important;
                width: 100% !important;
            }

            /* Cada linha do banco vira um item flexível com posição relativa */
            .table tr {
                display: flex !important;
                align-items: center !important;
                width: 100% !important;
                background-color: #ffffff !important;
                border-bottom: 1px solid #e9ecef !important;
                padding: 0.75rem 0.5rem !important;
                box-sizing: border-box !important;
                margin-bottom: 0 !important;
                box-shadow: none !important;
                border-top: none !important;
                border-left: none !important;
                border-right: none !important;
                border-radius: 0 !important;
                min-height: 4.8rem !important;
                position: relative !important;
            }

            /* Célula do Nome: Injeta o ícone e serve de base para o bloco central */
            .table td:nth-child(1) {
                display: flex !important;
                align-items: center !important;
                flex-grow: 1 !important;
                text-align: left !important;
                padding: 0 !important;
                border: none !important;
            }

            /* Cria dinamicamente o ícone de caixa grande à esquerda */
            .table td:nth-child(1)::before {
                content: "📦" !important;
                font-size: 2.2rem !important;
                margin-right: 0.85rem !important;
                display: inline-block !important;
            }

            /* Estiliza o Nome da Caixa */
            .table td:first-child a {
                display: block !important;
                font-size: 1.15rem !important;
                font-weight: bold !important;
                color: #212529 !important;
            }

            /* Célula da Quantidade: Joga o valor para baixo do Nome */
            .table td:nth-child(2) {
                display: block !important;
                position: absolute !important;
                margin-left: 3.2rem !important;
                margin-top: 1.8rem !important;
                font-size: 0.875rem !important;
                color: #6c757d !important;
                padding: 0 !important;
                border: none !important;
                text-align: left !important;
            }

            /* Adiciona o prefixo dinâmico "Quantidade: " antes do número */
            .table td:nth-child(2)::before {
                content: "Quantidade: " !important;
                font-weight: normal !important;
                color: #6c757d !important;
            }

            /* Célula de Ações: Joga os botões para a extremidade direita */
            .table td:nth-child(3) {
                display: flex !important;
                justify-content: flex-end !important;
                align-items: center !important;
                padding: 0 !important;
                border: none !important;
                margin-left: auto !important;
            }

            .table td.text-end {
                width: auto !important;
            }
            .actions-cell {
                display: flex !important;
                gap: 0.5rem !important;
            }

            /* Ajusta os botões estilo app nativo (clean e espaçados) */
            .table .btn-sm {
                padding: 0.4rem 0.6rem !important;
                font-size: 1.05rem !important;
                border: 1px solid #dee2e6 !important;
                background-color: #f8f9fa !important;
                border-radius: 0.375rem !important;
            }

            /* Garante o ajuste perfeito do modal popover */
            div[popover] {
                width: 92% !important;
                max-width: 92% !important;
                margin: auto !important;
                box-sizing: border-box !important;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragmentos/menu :: navegacao}"></div>

<div class="container">
    <div class="header-actions">
        <h2 class="title">🗃️ Estoque</h2>
        <button class="btn btn-primary" popovertarget="modalCaixa">+ Nova Caixa</button>
    </div>

    <!-- Banners de Alertas Responsivos -->
    <div th:if="${mensagemErro}" class="alert" style="background-color: #f8d7da; border: 1px solid #f5c2c7; color: #842029; padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 1rem; display: flex; gap: 0.5rem; word-break: break-word;">
        <span>⚠️</span>
        <span th:text="${mensagemErro}"></span>
    </div>

    <div th:if="${mensagemSucesso}" class="alert" style="background-color: #d1e7dd; border: 1px solid #badbcc; color: #0f5132; padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 1rem; display: flex; gap: 0.5rem; word-break: break-word;">
        <span>✅</span>
        <span th:text="${mensagemSucesso}"></span>
    </div>

    <!-- Container adicionado para scroll dinâmico da tabela em telas pequenas -->
    <div class="card table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th style="padding-left: 1.5rem;">Nome</th>
                <th class="text-center">Total de Produtos</th>
                <th class="text-end" style="padding-right: 1.5rem;">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${caixas}">
                <td style="padding-left: 1.5rem; font-weight: bold;">
                    <a th:href="@{/produtos(caixaId=${c.id})}"
                       th:text="${c.codigoCaixa}"
                       style="color: inherit; text-decoration: none; cursor: pointer;"
                       onmouseover="this.style.textDecoration='underline'"
                       onmouseout="this.style.textDecoration='none'">
                    </a>
                </td>

                <td class="text-center" th:text="${c.quantidadeProdutos}">0</td>

                <td class="text-end" style="padding-right: 1.5rem; white-space: nowrap;">
                    <button class="btn btn-sm btn-outline-warning" th:popovertarget="'modalEditar' + ${c.id}">✏️</button>

                    <button class="btn btn-sm btn-outline-danger" th:popovertarget="'modalDeletar' + ${c.id}">🗑️</button>

                    <div popover th:id="'modalDeletar' + ${c.id}">
                        <div class="modal-header" style="background-color: #dc3545;">
                            <h5 class="modal-title">Confirmar Exclusão</h5>
                            <button type="button" class="btn-close" th:popovertarget="'modalDeletar' + ${c.id}" popovertargetaction="hide">×</button>
                        </div>
                        <div class="modal-body" style="text-align: left; padding: 1.5rem; white-space: normal;">
                            <p style="margin: 0; font-size: 1rem;">
                                Deseja realmente deletar <strong><span th:text="${c.codigoCaixa}"></span></strong>?
                            </p>
                            <p style="margin: 0.5rem 0 0 0; font-size: 0.875rem; color: #dc3545; font-weight: bold;">
                                ⚠️ Atenção: A Caixa precisa estar vazia para poder Excluir.
                            </p>
                        </div>
                        <div class="modal-footer" style="background-color: #f8f9fa;">
                            <button type="button" class="btn btn-secondary" th:popovertarget="'modalDeletar' + ${c.id}" popovertargetaction="hide">Cancelar</button>
                            <a th:href="@{/caixas/deletar/{id}(id=${c.id})}" class="btn" style="background-color: #dc3545; color: white;">Excluir Permanentemente</a>
                        </div>
                    </div>

                    <div popover th:id="'modalEditar' + ${c.id}">
                        <div class="modal-header">
                            <h5 class="modal-title">Renomear Caixa</h5>
                            <button type="button" class="btn-close" th:popovertarget="'modalEditar' + ${c.id}" popovertargetaction="hide">×</button>
                        </div>
                        <form th:action="@{/caixas/editar/{id}(id=${c.id})}" method="POST">
                            <div class="modal-body" style="text-align: left; white-space: normal;">
                                <label class="form-label">Novo Código do Caixa</label>
                                <input type="text" name="codigoCaixa" th:value="${c.codigoCaixa}" class="form-control" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" th:popovertarget="'modalEditar' + ${c.id}" popovertargetaction="hide">Fechar</button>
                                <button type="submit" class="btn btn-success">Salvar Alteração</button>
                            </div>
                        </form>
                    </div>

                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div popover id="modalCaixa">
    <div class="modal-header">
        <h5 class="modal-title">Novo Caixa</h5>
        <button type="button" class="btn-close" popovertarget="modalCaixa" popovertargetaction="hide">×</button>
    </div>
    <form th:action="@{/caixas/salvar}" method="POST">
        <div class="modal-body">
            <label class="form-label">Código do Caixa</label>
            <input type="text" name="codigoCaixa" class="form-control" placeholder="Ex: Caixa 4" required>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" popovertarget="modalCaixa" popovertargetaction="hide">Fechar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>

<!-- Script dos alertas -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(function(alert) {
            alert.style.transition = 'opacity 0.5s ease';

            setTimeout(function() {
                alert.style.opacity = '0';
                setTimeout(function() {
                    alert.remove();
                }, 500);
            }, 4000);
        });
    });
</script>

</body>
</html>
