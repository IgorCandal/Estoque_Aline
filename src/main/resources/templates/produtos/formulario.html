<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Produto</title>
    <!-- Estilização Customizada do Formulário -->
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #212529;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        /* Cartão (Card) */
        .card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background-color: #212529;
            color: white;
            padding: 1rem;
        }
        .card-header h4 {
            margin: 0;
            font-size: 1.25rem;
        }
        .card-body {
            padding: 1.5rem;
        }

        /* Estrutura do Formulário e Grid */
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        /* Ajuste para telas pequenas (Celulares) */
        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Elementos de Entrada (Inputs/Selects) */
        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-control, .form-select {
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            box-sizing: border-box;
            background-color: #fff;
            color: #212529;
        }
        .form-control:focus, .form-select:focus {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        /* Rodapé e Botões */
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #dee2e6;
            margin-top: 1.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 1rem;
            font-size: 1rem;
            border-radius: 0.375rem;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn-outline-secondary {
            border-color: #6c757d;
            color: #6c757d;
            background: transparent;
        }
        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: white;
        }
        .btn-success {
            background-color: #198754;
            color: white;
            font-weight: 500;
        }
        .btn-success:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>
<div th:replace="~{fragmentos/menu :: navegacao}"></div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h4 th:text="${produto == null} ? '📦 Cadastrar Produto' : '✏️ Editar Produto'">Formulário</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/produtos/salvar}" method="POST" enctype="multipart/form-data">
                <!-- Controle de ID para Edição -->
                <input type="hidden" name="id" th:value="${produto != null ? produto.id : null}">

                <div class="form-group">
                    <label class="form-label">Nome do Produto</label>
                    <input type="text" name="nome" th:value="${produto != null ? produto.nome : ''}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <input type="text" name="categoria" th:value="${produto != null ? produto.categoria : ''}" class="form-control" required>
                </div>

                <!-- Grid de 2 colunas para Preço e Quantidade -->
                <div class="form-row">
                    <div>
                        <label class="form-label">Preço Unitário</label>
                        <input type="number" step="0.01" name="preco" th:value="${produto != null ? produto.preco : ''}" class="form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Quantidade</label>
                        <input type="number" name="quantidade" th:value="${produto != null ? produto.quantidade : ''}" class="form-control" required>
                    </div>
                </div>

                <!-- Grid de 2 colunas para Validade e Caixa -->
                <div class="form-row">
                    <div>
                        <label class="form-label">Data de Validade</label>
                        <input type="date" name="validade" th:value="${produto != null ? produto.validade : ''}" class="form-control">
                    </div>
                    <div>
                        <label class="form-label">Vincular ao Caixa</label>
                        <select name="caixaId" class="form-select" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option th:each="cx : ${caixas}"
                                    th:value="${cx.id}"
                                    th:text="${cx.codigoCaixa}"
                                    th:selected="${produto != null && produto.caixaId == cx.id}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Foto do Produto (Upload)</label>
                    <input type="file" name="imagemFile" class="form-control" accept="image/*">
                </div>

                <div class="form-footer">
                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Confirmar e Salvar</button>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
