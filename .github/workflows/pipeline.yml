name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]

jobs:

  build:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install -DskipTests

  package:
    needs: [ build ]
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Application App
        run: mvn -B package --file pom.xml -DskipTests

  test:
    needs: [ package ]
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Test Application App
        run: mvn clean install -DskipTests

  echo-info:
    needs: [ test ]
    name: Pipeline Summary Info
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print Execution Details
        run: |
          echo "============================================="
          echo " PIPELINE EXECUTION SUMMARY"
          echo "============================================="
          echo "Branch:           ${{ github.ref_name }}"
          echo "Triggered by:     ${{ github.actor }}"
          echo "Pipeline Status:  ${{ needs.test.result == 'success' && 'SUCCESS' || 'FAILED' }}"
          echo "============================================="